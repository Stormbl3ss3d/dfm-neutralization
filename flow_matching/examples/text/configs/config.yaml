defaults:
  - _self_

compute:
  ngpus: 1
  nodes: 1

logging:
  log_freq: 100
  log_lr_every: ${logging.log_freq}
  log_file_name: stdout.log
  enable_wandb: false
  entity: flows
  project: flow_matching
  group: null

data:
  train: wnc
  valid: wnc
  cache_dir: ./data_cache
  num_workers: 4

training:
  batch_size: 8
  snapshot: 1000
  eval_freq: 500
  perplexity_freq: 5000
  seed: 42

eval:
  batch_size: 8
  sample_batch_size: 4
  perplexity: false
  perplexity_batch_size: 4

optim:
  weight_decay: 0.03
  optimizer: AdamW
  lr: 3e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  warmup: 250
  grad_clip: 1.
  eta_min_ratio: 0.1
  fused: false
  n_iters: 5000
  log_lr_every: ${logging.log_lr_every}

flow:
  source_distribution: uniform 
  loss_function: cross_entropy 
  exponent: 1.
  scheduler_type: polynomial
  sampling_steps: 128

model:
  hidden_size: 384
  cond_dim: 128
  length: 128
  n_blocks: 6
  n_heads: 6
  dropout: 0.1
  compile: false

hydra_dir: ./outputs

hydra:
  run:
    dir: ${hydra_dir}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: ${hydra_dir}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
